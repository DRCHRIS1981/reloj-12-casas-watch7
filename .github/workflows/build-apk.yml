name: Compilar AAB Google Play

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reparar PNG heredados
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('app/src/main/res/drawable')
          for name in ('dial_v2.png', 'flame_v3.png'):
              p = root / name
              im = Image.open(p).convert('RGBA')
              tmp = root / (p.stem + '_fixed.png')
              im.save(tmp, format='PNG', optimize=True, compress_level=9)
              tmp.replace(p)
              print('Reparado', p, p.stat().st_size, 'bytes')
          unused = root / 'dial_v3.png'
          if unused.exists():
              unused.unlink()
              print('Eliminado recurso corrupto no utilizado:', unused)
          PY
      - name: Ajustar XML para WFF2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/raw/watchface.xml')
          text = p.read_text(encoding='utf-8')
          n = text.count(' verticalAlign="CENTER"')
          text = text.replace(' verticalAlign="CENTER"', '')
          p.write_text(text, encoding='utf-8')
          print('verticalAlign eliminado:', n, 'ocurrencias')
          if 'verticalAlign=' in text:
              raise SystemExit('Aun quedan atributos verticalAlign en watchface.xml')
          PY
      - name: Compilar AAB release
        run: gradle :app:bundleRelease --stacktrace
      - name: Verificar bundle WFF
        run: |
          unzip -l app/build/outputs/bundle/release/app-release.aab | tee /tmp/aab-list.txt
          if grep -E '(^|/)classes[0-9]*\.dex$|(^|/)dex/' /tmp/aab-list.txt; then
            echo 'ERROR: el AAB contiene DEX'
            exit 1
          fi
          echo 'OK: AAB sin DEX'
      - name: Copiar AAB a dist
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/reloj-12-casas-unsigned.aab
      - name: Publicar AAB generado en el repo
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/reloj-12-casas-unsigned.aab
          git commit -m "Build AAB Google Play [skip ci]" || exit 0
          git push
      - name: Subir AAB como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reloj-12-Casas-AAB
          path: dist/reloj-12-casas-unsigned.aab
          if-no-files-found: error
