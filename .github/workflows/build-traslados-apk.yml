name: Compilar Registro de Traslados APK

on:
  push:
    branches: [ registro-traslados-android ]
    paths:
      - 'traslado-app/**'
      - '.github/workflows/build-traslados-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        working-directory: traslado-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p dist-traslados
          cp traslado-app/app/build/outputs/apk/debug/app-debug.apk dist-traslados/RegistroTraslados.apk

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Registro-Traslados-APK
          path: dist-traslados/RegistroTraslados.apk
          if-no-files-found: error
